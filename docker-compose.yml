version: "3.9"

services:

  # ── Straddle Bot ─────────────────────────────────────────────────────────────
  bot:
    build: .
    image: straddle-bot:${APP_VERSION:-latest}
    command: python straddle_trader.py
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/straddle_paper.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - straddle_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sqlite3; sqlite3.connect('/data/straddle_paper.db').execute('SELECT 1')\""]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 15s

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  dashboard:
    build: .
    image: straddle-dashboard:${APP_VERSION:-latest}
    command: python dashboard.py --port 8080 --db /data/straddle_paper.db
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - straddle_data:/data
    ports:
      - "8080:8080"
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/live', timeout=3)\""]
      interval: 20s
      timeout:  5s
      retries:  3
      start_period: 20s

# ── Named volume — persists DB across container restarts ──────────────────────
volumes:
  straddle_data:
